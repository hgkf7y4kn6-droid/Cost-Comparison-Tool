services:
  - type: web
    name: cost-comparison-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # CLIP + torch need ~1.5-2 GB RAM; the free/starter plans will run out of memory
    plan: standard
    healthCheckPath: /health
    envVars:
      # The web app is served by this service, on your domain and on the
      # .onrender.com URL, which needs no CORS. Set this only if you also run the
      # frontend somewhere else (e.g. Cloudflare), to that site's address:
      # https://cost-comparison-tool.<your-subdomain>.workers.dev
      # Left unset, only same-site requests are allowed.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /var/data
      # Signs sign-in tokens. Render generates a random value once; keep it
      # stable or everyone is signed out on each change.
      - key: AUTH_SECRET
        generateValue: true
      # Who can sign in: comma-separated "email:password_hash" entries.
      # Create each hash with `python auth.py hash-password`. Set it in the
      # Render dashboard (not in this file); the API refuses all requests until
      # it's set.
      - key: AUTH_USERS
        sync: false
      # Emails (comma-separated) who can open and edit every account.
      - key: AUTH_MANAGERS
        sync: false
    disk:
      name: ob-data
      mountPath: /var/data
      sizeGB: 1
