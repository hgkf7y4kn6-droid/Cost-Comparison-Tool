services:
  - type: web
    name: cost-comparison-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # CLIP + torch need ~1.5-2 GB RAM; the free/starter plans will run out of memory
    plan: standard
    healthCheckPath: /health
    envVars:
      # Set to your Cloudflare frontend URL once it's deployed, e.g.
      # https://cost-comparison-tool.<your-subdomain>.workers.dev
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: /var/data
      # Clerk "Frontend API URL" (Clerk dashboard -> API keys), e.g.
      # https://your-app.clerk.accounts.dev. Required: the API rejects all
      # requests until it's set.
      - key: CLERK_ISSUER
        sync: false
      # Optional: comma-separated web origins allowed to use the API, e.g.
      # https://cost-comparison-tool.<your-subdomain>.workers.dev
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
    disk:
      name: ob-data
      mountPath: /var/data
      sizeGB: 1
