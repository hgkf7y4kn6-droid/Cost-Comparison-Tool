services:
  - type: web
    name: cost-comparison-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    # CLIP + torch need ~1.5-2 GB RAM; the free/starter plans will run out of memory
    plan: standard
    healthCheckPath: /health
    envVars:
      # The web app is served by this service, on your domain and on the
      # .onrender.com URL, which needs no CORS. Set this only if you also run the
      # frontend somewhere else (e.g. Cloudflare), to that site's address:
      # https://cost-comparison-tool.<your-subdomain>.workers.dev
      # Left unset, only same-site requests are allowed.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /var/data
      # Signs sign-in tokens. Render generates a random value once; keep it
      # stable or everyone is signed out on each change.
      - key: AUTH_SECRET
        generateValue: true
      # Who can sign in: comma-separated "email:password_hash" entries.
      # Create each hash with `python auth.py hash-password`. Set it in the
      # Render dashboard (not in this file); the API refuses all requests until
      # it's set.
      - key: AUTH_USERS
        sync: false
      # Emails (comma-separated) who can open and edit every account.
      - key: AUTH_MANAGERS
        sync: false
      # Optional: turns on "Tidy with AI" for quick notes (rewrites a dictated
      # note and pulls out the next action). Without it that button still fills
      # in the kind of touch and next action using simple rules. The note text
      # is sent to Anthropic when this is set. NOTES_AI_MODEL overrides the model.
      # The same key also reads business card photos (Scan card); without it that
      # falls back to Tesseract OCR. CARD_AI_MODEL overrides the vision model.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Customer finder (Prospecting -> Find customers). Keys stay on the server.
      # GOOGLE_PLACES_API_KEY: a Google Cloud key with Places API (New) enabled, restricted
      # to this server's outbound IPs or left unrestricted by referrer (it is never sent to browsers).
      # APOLLO_API_KEY: an Apollo API key (organization search, organization enrich, people search).
      # FINDER_DAILY_CALLS caps lookups per rep per day (default 150) to bound Google/Apollo spend.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: FINDER_DAILY_CALLS
        value: "150"
      # AI personas (Coach tab) use ANTHROPIC_API_KEY too. COACH_AI_MODEL overrides the model.
    disk:
      name: ob-data
      mountPath: /var/data
      sizeGB: 1
