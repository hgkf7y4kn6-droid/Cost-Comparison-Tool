name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Superuser used by the tests to create throwaway databases.
      TEST_PG_ADMIN: "host=localhost port=5432 user=postgres password=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Backend tests (SQLite and Postgres)
        run: python -m pytest tests -q -rs
      - name: Frontend syntax check
        run: for f in frontend/*.js; do node --check "$f" || exit 1; done
